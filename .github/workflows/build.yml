name: Yorumi — Build (main)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          mkdir -p app/keystore
          keytool -genkey -v \
            -keystore app/persistent-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Yorumi Debug, OU=Dev, O=Yorumi, L=Unknown, S=Unknown, C=US"

      - name: Build Debug APK
        run: ./gradlew --console=plain assembleFossDebug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Yorumi
          PULL_REQUEST: "false"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yorumi-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 7
