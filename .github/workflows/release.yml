name: Yorumi — Build & Release

on:
  push:
    branches:
      - "main"
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION=$(grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          VERSION_CODE=$(grep -m1 -oP '^\s*versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Version: $NEW_VERSION (code: $VERSION_CODE)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git show HEAD^:app/build.gradle.kts > /dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:app/build.gradle.kts | grep -m1 -oP '^\s*versionName\s*=\s*"\K[^"]+' || echo "")
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "version_changed=true" >> $GITHUB_OUTPUT
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            else
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: foss
            variantName: Foss
            apkName: Yorumi.apk
          - variant: gms
            variantName: Gms
            apkName: Yorumi-with-Google-Cast.apk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: Yorumi
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          METROLIST_BUILD_COMMIT: ${{ github.sha }}

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Rename signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED=$(find "$OUTPUT_DIR" -maxdepth 1 -name "*-signed.apk" -o -name "*-unsigned-signed.apk" | head -1)
          if [ -z "$SIGNED" ]; then
            echo "No signed APK found:"
            ls -la "$OUTPUT_DIR"
            exit 1
          fi
          mv "$SIGNED" "$OUTPUT_DIR/out/${{ matrix.apkName }}"
          echo "Output: ${{ matrix.apkName }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apkName }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/${{ matrix.apkName }}

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: release_files/

      - name: Flatten APK files
        run: |
          find release_files -name "*.apk" -exec mv {} release_files/ \;
          find release_files -type d -empty -delete
          echo "Release files:"
          ls -lah release_files/*.apk

      - name: Parse changelog
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          if [ -f .github/scripts/parse_changelog.sh ]; then
            chmod +x .github/scripts/parse_changelog.sh
            bash .github/scripts/parse_changelog.sh "$VERSION" changelog.md > release_notes.md 2>/dev/null || true
          fi
          if [ ! -s release_notes.md ]; then
            echo "Yorumi v$VERSION" > release_notes.md
            echo "" >> release_notes.md
            git log "$(git describe --tags --abbrev=0 2>/dev/null || echo 'HEAD~10')..HEAD" \
              --pretty=format:"- %s" --no-merges | head -20 >> release_notes.md || echo "- Initial release" >> release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check-version.outputs.new_version }}" \
            --title "Yorumi v${{ needs.check-version.outputs.new_version }}" \
            --notes-file release_notes.md \
            --latest \
            release_files/*.apk
          echo "Release created: v${{ needs.check-version.outputs.new_version }}"
